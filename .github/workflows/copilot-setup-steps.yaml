on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: ⬇️ Git Checkout
        uses: actions/checkout@v7

      - name: ✨ Setup Pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.0
          activate-environment: true

      - name: 🛠️ Additional Initialization
        run: APM_TARGET=copilot task init

      # Installing for the copilot target alone rewrites apm.lock.yaml without the other targets' deployments.
      # Put the file back as checked out so that it isn't committed by accident.
      - name: ♻️ Restore APM Lock File
        run: git checkout -- apm.lock.yaml
