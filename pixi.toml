[workspace]
channels = ["https://repo.prefix.dev/brads-forge", "conda-forge"]
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64", "linux-aarch64"]

[target.unix.activation.env]
PATH = "$PWD/scripts:$PATH"
USER_MEMORY_FILE_PATH = "$HOME/.config/mcp-memory/memory.jsonl"

[dependencies]
apm = ">=0.33.0,<0.34"
cocogitto = ">=7.0.0,<8"
deno = ">=2.9.7,<2.10"
dprint = ">=0.63.0,<0.64"
lefthook = ">=2.2.2,<3"
obscura = ">=0.2.4,<0.3"
rattler-build = ">=0.77.0,<0.78"
task = ">=3.54.0,<4"
