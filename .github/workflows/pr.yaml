on:
  pull_request:
    paths:
      - forge/**

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      recipes: ${{ steps.changed.outputs.recipes }}
    steps:
      - name: ⬇️ Git Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ⚙️ Install pixi env
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.0
          activate-environment: true

      - name: 🔍 Find Changed Recipes
        id: changed
        run: scripts/changed-recipes.ts --base origin/${{ github.base_ref }}

  dryrun:
    needs: changes
    if: needs.changes.outputs.recipes != '[]'
    name: ${{ matrix.recipe }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.changes.outputs.recipes) }}
        os:
          - ubuntu-latest
          - windows-latest
          - macos-15-intel
          - macos-latest
    steps:
      - name: ⬇️ Git Checkout
        uses: actions/checkout@v7

      - name: ⚙️ Install pixi env
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.0
          activate-environment: true

      - name: 🧪 Dry Run Recipe
        run: task dryrun RECIPE=${{ matrix.recipe }}
