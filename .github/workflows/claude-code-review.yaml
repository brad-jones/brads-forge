name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: ⬇️ Git Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: ✨ Setup Pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.0
          activate-environment: true

      - name: 🛠️ Additional Initialization
        run: APM_TARGET=claude task init

      - name: ♻️ Restore APM Lock File
        run: git checkout -- apm.lock.yaml

      - name: 👮 Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "*"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # With track_progress off the action runs in agent mode, where every tool the review
          # needs, including the inline comment server, has to be allowed here. `gh pr comment` is
          # denied because the summary goes on the approval instead of its own comment.
          claude_args: >-
            --allowedTools mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)
            --disallowedTools Bash(gh pr comment:*)
            --json-schema '{"type":"object","required":["verdict","summary"],"properties":{"verdict":{"enum":["approve","request_changes","skipped"]},"summary":{"type":"string"}}}'
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment

            Every new commit needs its own review, so comments you left on earlier commits are not a
            reason to stop at step 1.

            Don't post a summary comment when you find no issues, the workflow puts your `summary` on
            its approval.

            When the review is complete, set `verdict` to "approve" if you found no issues, to
            "request_changes" if you posted any, or to "skipped" if you stopped at step 1. Set `summary`
            to a markdown outcome summary: a checklist of dimensions reviewed (correctness, security,
            tests, conventions), findings counted by severity, and a one-line verdict such as
            "✅ no blocking issues" or "❌ N issues to fix".

      - name: 🐛 Debug Review Outputs
        env:
          OUTPUTS: ${{ toJSON(steps.claude-review.outputs) }}
          CONCLUSION: ${{ steps.claude-review.conclusion }}
          STRUCTURED: ${{ steps.claude-review.outputs.structured_output }}
        run: |
          echo "conclusion: $CONCLUSION"
          echo "outputs: $OUTPUTS"
          echo "structured_output: $STRUCTURED"
          echo "$STRUCTURED" | jq -r 'type, (if type == "object" then "verdict=\(.verdict) summary=\(.summary)" else empty end)' || true

      - name: ✔️ Approve PR
        if: fromJSON(steps.claude-review.outputs.structured_output || '{}').verdict == 'approve'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ fromJSON(steps.claude-review.outputs.structured_output || '{}').summary }}
        run: gh pr review ${{ github.event.pull_request.number }} --approve --body "$SUMMARY"

      - name: ✋ Request Changes
        if: fromJSON(steps.claude-review.outputs.structured_output || '{}').verdict == 'request_changes'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ fromJSON(steps.claude-review.outputs.structured_output || '{}').summary }}
        run: gh pr review ${{ github.event.pull_request.number }} --request-changes --body "$SUMMARY"

      # The action skips the review without failing when this file differs from the default
      # branch's copy, eg: on a PR that edits it. A crash still fails the review step itself.
      - name: ⚠️ Warn if the Review Gave No Verdict
        if: steps.claude-review.outputs.structured_output == ''
        run: echo "::warning::Claude Code Review gave no verdict, so the PR was neither approved nor sent back"
